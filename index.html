<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<!-- BEZ AUTOMATICKÉHO PŘEKLADU (v1216; Denis: „proč na některých telefonech vidím jiný jazyk titulků než angličtinu?
     Sjednoť to"): stránka tvrdila lang="cs", texty jsou anglicky — Chrome / Safari je pak „přeložily" do jazyka
     telefonu (titulky, souhrn, banner, bublina jsou HTML nad plátnem). Jazyk hry je angličtina a překlad se vypíná
     (translate="no" + meta google notranslate pro Chrome). -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quack and Splash!</title>
<style>
  /* Lilita One (OFL) — vlastní kopie, ne CDN: hra musí jet offline a v Gamee zipu.
     Dva podsety: „latin" na skóre a anglické popisky, „latin-ext" kvůli české
     diakritice. swap = do načtení se kreslí náhradní písmo, ne neviditelný text. */
  @font-face{ font-family:'Lilita One'; font-style:normal; font-weight:400;
    font-display:swap; src:url(./fonts/lilitaone-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,
      U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,
      U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face{ font-family:'Lilita One'; font-style:normal; font-weight:400;
    font-display:swap; src:url(./fonts/lilitaone-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,
      U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,
      U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

  /* ŽÁDNÁ GESTA PROHLÍŽEČE (Denis, 30. 9.: tah prstem posouval stránku a vracel
     v historii). overscroll-behavior vypne přetažení stránky, obnovení tahem dolů
     a v Chromu „zpět" tahem od okraje; position:fixed drží stránku na místě i na
     iPhonu. Gesto „zpět" v Safari zastavuje až míření (hra/mireni.js). */
  html,body{ margin:0; height:100%; background:#1b2330; overflow:hidden;
             touch-action:none; overscroll-behavior:none;
             -webkit-user-select:none; user-select:none; -webkit-touch-callout:none }
  body{ position:fixed; inset:0 }
  /* Rozměr plátna nastavuje hra (main.js, nejširší záběr 3:4); na širší obrazovce
     zůstane uprostřed a po stranách je pozadí stránky. */
  canvas{ display:block; margin:0 auto; touch-action:none }
  #verze{ position:fixed; right:8px; bottom:6px; pointer-events:none;
          font:14px 'Lilita One',"Arial Rounded MT Bold",Arial,sans-serif; color:#fbf1dcaa }
</style>
</head>
<body>
<div id="verze"></div>
<!-- Gamee SDK v3 (IIFE → window.Gamee.gamee). Mimo platformu se hra obejde bez něj. -->
<script src="lib/gamee-sdk.iife.js"></script>
<!-- výstup buildu (npm run dev / build) — jeden klasický skript, ne ES modul -->
<script src="js/hra.js"></script>
</body>
</html>
